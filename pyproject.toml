[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boilerack"
description = "Pont MQTT transactionnel pour chaudieres Viessmann via vcontrold"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Antoine Valentin" }]
keywords = ["mqtt", "vcontrold", "viessmann", "optolink", "home-assistant", "boiler"]
classifiers = [
    "Development Status :: 1 - Planning",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
]

# Source unique de version : src/boilerack/__init__.py (voir [tool.hatch.version]).
dynamic = ["version"]

# Premiere et seule dependance d'execution (lot C4) : le client MQTT Paho v2,
# requis par l'adaptateur MQTT reel `boilerack.adapters.mqtt_paho`. Licence
# `EPL-2.0 OR BSD-3-Clause` (permissive, compatible MIT), pur-Python, supporte
# Python >= 3.7 (donc 3.11 / 3.12 / 3.13). API callbacks `VERSION2`.
# L'adaptateur `vclient` n'ajoute aucune dependance : il s'appuie sur la
# bibliotheque standard (`subprocess`).
dependencies = ["paho-mqtt>=2.1,<3"]

[project.optional-dependencies]
# Outils de test uniquement. Strictement separes des dependances d'execution.
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/antoinevalentinHA/boilerack"

[tool.hatch.version]
path = "src/boilerack/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/boilerack"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
markers = [
    "reference: comportement eprouve, a conserver dans le produit final",
    "accident: comportement actuel non souhaite, caracterise sans etre normatif",
    "divergence_ratified: comportement qui devra changer selon D-1 a D-10",
    "unknown: comportement non demontre ou dependant d'un effet externe",
]
