[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boilerack"
description = "Pont MQTT transactionnel pour chaudieres Viessmann via vcontrold"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Antoine Valentin" }]
keywords = ["mqtt", "vcontrold", "viessmann", "optolink", "home-assistant", "boiler"]
classifiers = [
    "Development Status :: 1 - Planning",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
]

# Source unique de version : src/boilerack/__init__.py (voir [tool.hatch.version]).
dynamic = ["version"]

# Premiere et seule dependance d'execution (lot C4) : le client MQTT Paho v2,
# requis par l'adaptateur MQTT reel `boilerack.adapters.mqtt_paho`. Licence
# `EPL-2.0 OR BSD-3-Clause` (permissive, compatible MIT), pur-Python, supporte
# Python >= 3.7 (donc 3.11 / 3.12 / 3.13). API callbacks `VERSION2`.
# L'adaptateur `vclient` n'ajoute aucune dependance : il s'appuie sur la
# bibliotheque standard (`subprocess`).
dependencies = ["paho-mqtt>=2.1,<3"]

[project.optional-dependencies]
# Outils de test et de qualite uniquement. Strictement separes des dependances
# d'execution.
dev = ["mypy>=2.3", "pytest>=8", "ruff>=0.16"]

# Commande installee (lot C10). `python -m boilerack` reste equivalent : les
# deux chemins appellent la meme fonction, et `__main__.py` ne porte aucune
# logique propre. Aucune dependance n'est ajoutee.
[project.scripts]
boilerack = "boilerack.cli:main"

[project.urls]
Homepage = "https://github.com/antoinevalentinHA/boilerack"

[tool.hatch.version]
path = "src/boilerack/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/boilerack"]

# Lot B1 : verification statique, jeu MINIMAL et perimetre RESTREINT.
#
# PERIMETRE
#     `src` seul. L'extension a `tests` est le pas B2, non decide.
#
# JEU DE REGLES
#     Declare explicitement, et non herite du defaut de l'outil : ce que `ruff`
#     applique de lui-meme varie d'une version a l'autre, et deborde largement
#     ce qui est retenu ici. Voir docs/design/outillage-qualite-cadrage.md §3.1.
#
# EXCLUSION
#     `_legacy/primitives.py` porte une copie litterale du pont historique,
#     defauts compris, et sa docstring interdit de l'"ameliorer". Le linter y
#     releverait quatre `F541` et une `E501` : l'exclure n'est pas un confort,
#     c'est une condition de compatibilite avec ce que le module prescrit.
[tool.ruff]
line-length = 100
src = ["src"]
extend-exclude = ["src/boilerack/_legacy/primitives.py"]
# Sans ce drapeau, l'exclusion ne s'applique pas a un chemin passe explicitement
# en argument : `ruff check src` respecterait l'exclusion, `ruff check <fichier>`
# ne la respecterait pas. La garantie doit tenir dans les deux cas.
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "E501"]

# Lot C1 : verification de types, reglage PAR DEFAUT.
#
# PERIMETRE
#     `src/boilerack` en entier, `_legacy` COMPRIS. L'exclusion retenue pour le
#     linter n'a pas lieu d'etre ici : mesure faite, `_legacy` ne produit
#     AUCUNE erreur de type. Voir docs/design/outillage-qualite-cadrage.md §4.5.
#
# NIVEAU
#     Le reglage par defaut, et lui seul. Le passage a `--strict` est le pas C2,
#     non decide : il porterait sur 22 erreurs et 7 fichiers.
#
# VERSION CIBLE
#     `3.11`, plancher declare par `requires-python` et plus basse version que
#     la CI execute. Verifier contre le plancher evite qu'une construction
#     valide seulement sur une version plus recente passe inapercue.
[tool.mypy]
python_version = "3.11"
files = ["src/boilerack"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
markers = [
    "reference: comportement eprouve, a conserver dans le produit final",
    "accident: comportement actuel non souhaite, caracterise sans etre normatif",
    "divergence_ratified: comportement qui devra changer selon D-1 a D-10",
    "unknown: comportement non demontre ou dependant d'un effet externe",
]
