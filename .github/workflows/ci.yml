name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Installation du paquet et des outils de test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Lot B1 : jeu de regles minimal, perimetre `src` seul, exclusion de
      # `_legacy/primitives.py` -- le tout declare dans `pyproject.toml`, et
      # non repete ici. Aucun drapeau : l'etape doit appliquer exactement la
      # configuration du depot, sans la reinterpreter en ligne de commande.
      #
      # Avant les tests, et non apres : une occurrence de lint se lit en une
      # ligne, la ou un echec de suite demande une lecture de journal.
      #
      # `ruff` est deja installe par l'etape precedente, via l'extra `dev`.
      - name: Verification statique
        run: python -m ruff check src

      # Lot B2 : MEME jeu de regles et MEME limite que l'etape precedente, sur
      # le perimetre `tests`. Rien n'est redeclare : la configuration de
      # `pyproject.toml` s'applique a l'un comme a l'autre, seul le chemin
      # change.
      #
      # Une etape distincte, et non un second chemin ajoute a la precedente :
      # une regression de lint se lit alors immediatement pour ce qu'elle est
      # -- du code de production, ou du code de test -- sans ouvrir le journal.
      # L'etape precedente reste inchangee.
      - name: Verification statique des tests
        run: python -m ruff check tests

      # Lot C1 : reglage PAR DEFAUT, perimetre `src/boilerack` -- `_legacy`
      # COMPRIS, faute d'erreur a y exclure -- et version cible `3.11`, le tout
      # declare dans `pyproject.toml`. Aucun drapeau, ni argument de chemin :
      # `files` suffit, et l'etape applique exactement la configuration du
      # depot sans la reinterpreter, comme l'etape precedente.
      #
      # Apres le lint et avant les tests : une erreur de type se lit aussi vite
      # qu'une occurrence de lint, et plus vite qu'un echec de suite.
      #
      # La version cible etant figee a `3.11`, les trois branches de la matrice
      # verifient le MEME code contre le MEME plancher. Ce qu'elles ajoutent
      # l'une par rapport a l'autre n'est donc pas l'analyse, mais le fait que
      # `mypy` s'installe et s'execute sur chaque interpreteur.
      #
      # `mypy` est deja installe par l'etape d'installation, via l'extra `dev`.
      - name: Verification de types
        run: python -m mypy

      - name: Tests
        run: python -m pytest -q
